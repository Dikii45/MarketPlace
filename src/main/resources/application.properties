spring.datasource.url=jdbc:mysql://localhost:3306/buysell
spring.datasource.username=root
spring.datasource.password=2412
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.freemarker.expose-request-attributes=true

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

server.port=8081

# JWT для REST API (/api/**). В проде — переопределить через переменную окружения APP_JWT_SECRET,
# как и остальные настройки в docker-compose.yml, а не хранить реальный секрет в git.
app.jwt.secret=dev-only-secret-change-me-32-bytes-minimum-please-1234567890
app.jwt.expiration-ms=86400000

# Swagger/OpenAPI документирует только REST API, не весь MVC-сайт
springdoc.paths-to-match=/api/**

# при первом запуске на пустой БД (например, свежий docker compose up) автоматически наполняет каталог демо-товарами
app.seed.enabled=true